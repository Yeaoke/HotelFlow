server:
  port: 8080

spring:
  profiles:
    active: dev

  main:
    allow-bean-definition-overriding: true

  dynamic:
    datasources:
      tenant-reservation:
        url: jdbc:postgresql://localhost:5432/reservation_info
        username: postgres
        password: MaL8033038
        driver-class-name: org.postgresql.Driver

        hikari:
          connection-timeout: 20000
          minimum-idle: 5
          maximum-pool-size: 12
          idle-timeout: 300000
          max-lifetime: 1200000
          pool-name: ReservationInfoPool

  data:
    redis:
      host: redis
      port: 6379

  jpa:
