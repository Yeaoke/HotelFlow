---
spring:
    config:
        activate:
            on-profile: prod

    datasource:
        url: "jdbc:postgresql://localhost:5432/postgres"
        username: ${DB_USERNAME:postgres}
        password: ${DB_PASSWORD:your_password}
        driver-class-name: "org.postgresql.Driver"
    jpa:
        hibernate:
            ddl-auto: validate
            show-sql: false

