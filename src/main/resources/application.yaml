spring:
  application:
    name: hotelflow
  profiles:
    active: ${PROFILE}

  datasource:
    url: ${DATABASE_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 10000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE}
    baseline-version: 1

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
      connect-timeout: 3s

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH}
          starttls:
            enable: ${SMTP_STARTTLS}
            required: ${SMTP_STARTTLS}
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

  web:
    error:
      include-message: never
      include-stacktrace: never

security:
  jwt:
    secret_key: ${SECRET_KEY}
    access_token_expiration: ${ACCESS_TOKEN_EXPIRATION:900000}
    refresh_token_expiration: ${REFRESH_TOKEN_EXPIRATION:604800000}
  otp:
    secret: ${OTP_SECRET}

app:
  mail:
    from: ${SMTP_FROM}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis

server:
  port: 8080
  shutdown: graceful