---
spring:
  config:
    activate:
      on-profile: prod

  dynamic:
    datasources:
      tenant-reservation:
        url: jdbc:postgresql://database:5432/reservation_info
        username: ${POSTGRES_USERNAME}
        password: ${POSTGRES_PASSWORD}
        driver-class-name: org.postgresql.Driver

        hikari:
          connection-timeout: 20000
          minimum-idle: 5
          maximum-pool-size: 12
          idle-timeout: 300000
          max-lifetime: 1200000
          pool-name: ReservationInfoPool

  data:
    redis:
      host: redis
      port: 6379

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    com.example.app: INFO