services:

  database:
    image: postgres:18-alpine
    container_name: hotelflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reservation_info
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: MaL8033038
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: hotelflow-redis
    restart: unless-stopped
    command: redis --appendonly yes --bind 0.0.0.0 --maxmemory 512mb
    volumes:
      - redis_data:/data

  hotelflow:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hotelflow-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - database
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: prod

volumes:
  postgres_data:
  redis_data: